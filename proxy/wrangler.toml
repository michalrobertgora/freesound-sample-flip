name = "freesound-flip-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# Per-IP rate limit — a basic backstop so an exposed proxy URL can't burn
# the shared Freesound quota unchecked. `period` must be 10 or 60.
# This binding is in open beta; if `wrangler deploy` rejects it on your
# version, comment this block out — the Worker guards for its absence and
# still runs (you can add a rate-limit rule in the Cloudflare dashboard
# instead). `namespace_id` is a local label; bump it only if it collides.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
